<script>
(async function () {
  const track = document.querySelector('[data-job-ticker]');
  if (!track) return;

  try {
    const res = await fetch('/api/jobs');
    if (!res.ok) throw new Error('Failed to load jobs');
    const data = await res.json();

    if (!data.jobs || data.jobs.length === 0) {
      track.innerHTML = '<span class="job-ticker-item show">Ask us about your next job — get an instant quote today.</span>';
      return;
    }

    track.innerHTML = data.jobs
      .map(job => `<span class="job-ticker-item">${job.category} completed — ${job.suburb} — ${job.date}</span>`)
      .join('');

    const items = track.querySelectorAll('.job-ticker-item');
    let i = 0;
    items[0].classList.add('show');

    setInterval(() => {
      items[i].classList.remove('show');
      i = (i + 1) % items.length;
      items[i].classList.add('show');
    }, 4000);

  } catch (err) {
    console.error('Job ticker error:', err);
    track.innerHTML = '<span class="job-ticker-item show">One team. Every trade. Get an instant quote today.</span>';
  }
})();
</script>

<style>
.job-ticker-item { display:none; }
.job-ticker-item.show { display:inline; animation: tickerFade .4s ease; }
@keyframes tickerFade { from { opacity:0; } to { opacity:1; } }
</style>
